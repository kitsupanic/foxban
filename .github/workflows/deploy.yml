name: deploy

# Set the DEPLOY_ON_PUSH repository variable to the name of a GitHub Environment
# to deploy it on every push to main; leave it unset to deploy only by hand.
# Each environment carries its own variables and secrets (see .env.deploy.example).
'on':
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        type: string

permissions:
  contents: read

concurrency:
  group: foxban-deploy-${{ inputs.environment || vars.DEPLOY_ON_PUSH }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || vars.DEPLOY_ON_PUSH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test && pnpm test:scripts

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          RATE_LIMIT_NAMESPACE_ID: ${{ vars.RATE_LIMIT_NAMESPACE_ID }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: pnpm run deploy

      - name: Health check
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::APP_URL is not set; skipping the health check."
            exit 0
          fi
          root_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 12 --retry-all-errors --retry-delay 5 "$APP_URL/")
          me_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 12 --retry-all-errors --retry-delay 5 "$APP_URL/me")
          [ "$root_status" = 200 ]
          [ "$me_status" = 401 ]
